[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sinu-class-3d"
version = "1.0.0"
description = "Non-invasive ECRS endotype prediction from routine sinus CT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Ethan Yu", email = "ethan@dgu.ac.kr" }
]

dependencies = [
  # Deep learning. torch is resolved from the CUDA 12.8 index declared in
  # [tool.uv.sources] below; a default-index torch would be CPU-only.
  "torch>=2.10.0",
  "monai>=1.5.2",

  # Numerical and data processing
  "numpy>=2.3.5",
  "pandas>=3.0.1",
  "scipy>=1.17.1",
  "scikit-learn>=1.8.0",
  "joblib>=1.5.3",

  # Medical imaging I/O
  "nibabel>=5.4.0",
  "pydicom>=3.0.1",

  # Image processing
  "opencv-python>=4.13.0.92",

  # Interactive volume previews used by the dataset preparation scripts
  "plotly>=6.6.0",

  # Config and logging
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "pyyaml>=6.0.3",
  "tqdm>=4.67.3",

  # Experiment tracking
  "wandb>=0.25.0",
]

[project.optional-dependencies]
# One-off dataset preparation: TotalSegmentator is invoked as a CLI to
# generate the sinus ROI masks, and lighter-zoo backs an exploratory model
# variant. Neither is needed to train or evaluate the published pipeline.
preprocessing = [
  "totalsegmentator>=2.0.0",
  "lighter-zoo>=0.1.3",
]

[project.scripts]
# train.py supports both single-fold and CV via config:
#   Single-fold: python scripts/train.py data.cross_validation.enabled=false
#   CV mode:     python scripts/train.py data.cross_validation.enabled=true
train-classification = "scripts.train:main"
evaluate-classification = "scripts.evaluate:main"
predict-classification = "scripts.predict:main"

# ---------------------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------------------
# PyTorch publishes CUDA builds on its own index. `explicit = true` keeps that
# index reserved for the packages mapped to it below, so everything else still
# resolves from PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
where = ["", "."]
include = ["scripts*", "src*", "configs*"]
