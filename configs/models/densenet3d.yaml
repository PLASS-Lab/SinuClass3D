# @package _global_
# ============================================================================
# 3D DenseNet-121 Model Configuration
# ============================================================================
# Capacity-comparison baseline reported in Table 6 of the paper.
# Trained with the identical data, split, schedule and augmentation as the
# primary sinus3dcnn model; only the architecture differs.
#
# Usage:
#   uv run python scripts/train.py models=densenet3d core.experiment_name=densenet3d_3ch_compare
# ============================================================================

model:
  name: "densenet3d"
  architecture: "densenet121"
  in_channels: 3                              # Air | Soft | Bone
  spatial_dims: 3
  dropout: 0.3                                # Dropout before final FC

